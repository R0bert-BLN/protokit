<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
  <title>Home</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/review.css">
</head>
<body data-root="../">
  <div class="device"><main class="screen" id="main"></main></div>
  <script src="https://unpkg.com/lucide@1.52.0/dist/umd/lucide.min.js"></script>
  <script src="../js/project.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/review.js"></script>
  <script>
    const { ui, data } = MK;
    MK.screen({
      title: 'Home',
      phase: 'p1',
      tab: 'home',
      back: false,
      actions: '<button type="button" class="icon-btn" aria-label="Notifications" data-open="notif">' + ui.icon('bell') + '</button>',
      render: () => `
        ${ui.card(`<h2>Hi, ${MK.esc(data.user.name.split(' ')[0])}!</h2><p class="muted">Sample screen from the template. Replace it.</p>
          <div class="row">${ui.button('Toast', { attrs: 'onclick="MK.toast(\'Saved\')"' })}${ui.button('Open sheet', { variant: 'secondary', attrs: 'data-open="notif"' })}</div>`)}
        ${ui.chips(['All', 'Nearby', 'Friends'], 'All')}
        ${ui.tabs([
          { id: 'a', label: 'People', content: ui.list(data.people.map((p) => ui.listRow({ title: p.name, subtitle: p.city, lead: ui.avatar(p.name), trail: ui.badge('Active', 'success') }))) },
          { id: 'b', label: 'Note', content: ui.note('Requires legal validation before implementation') },
        ])}
        ${ui.sheet('notif', 'Notifications', '<p class="muted">No new notifications.</p>')}
      `,
    });
  </script>
</body>
</html>
